name: Reusable - Build & Push Docker Image (Generic)

on:
  # This workflow is designed to be called by other workflows.
  workflow_call:
    # INPUTS: Parameters that must be passed by the calling workflow.
    inputs:
      branch:
        description: 'The branch to check out'
        required: true
        type: string
      registry_url:
        description: 'The URL of the private Docker registry'
        required: true
        type: string
      repository_name:
        description: 'The name of the repository to push the image to (e.g., my-app/my-service)'
        required: true
        type: string
      image_tag:
        description: 'The tag for the Docker image (e.g., latest, v1.0.0)'
        required: true
        type: string
        default: testing
      docker_file:
        description: 'The path to the Dockerfile'
        required: true
        type: string
        default: ./docker/Dockerfile
    # SECRETS: Sensitive information that must be passed by the calling workflow.
    secrets:
      registry_username:
        description: 'Username for the private Docker registry'
        required: true
      registry_password:
        description: 'Password or Access Token for the private Docker registry'
        required: true
      github_package_token:
        description: 'GitHub token with packages:read permission for private repositories'
        required: true
    # OUTPUTS: Values that will be returned to the calling workflow.
    outputs:
      docker_image_uri:
        description: "The full Docker image URI"
        value: ${{ jobs.build.outputs.docker_image_uri }}

jobs:
  build:
    name: Build and Push Docker Image to Generic Registry
    runs-on: ubuntu-latest
    outputs:
      docker_image_uri: ${{ steps.set-outputs.outputs.docker_image_uri }}
    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0 # Fetch all history for all branches and tags

      # Step 2: Log in to the generic private registry
      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.registry_url }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      # Step 3: Build the Docker image and push it to the specified repository.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.docker_file }}
          push: true
          build-args: |
            GITHUB_TOKEN=${{ secrets.github_package_token }}
            GITHUB_ACTOR=${{ github.actor }}
          tags: |
            ${{ inputs.registry_url }}/${{ inputs.repository_name }}:${{ inputs.image_tag }}

      # Step 4: Set the outputs for the calling workflow.
      - name: Set outputs
        id: set-outputs
        run: |
          echo "docker_image_uri=${{ inputs.registry_url }}/${{ inputs.repository_name }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
